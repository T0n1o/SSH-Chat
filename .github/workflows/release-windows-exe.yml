name: Build Windows EXEs

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build host exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name ssh-chat-host .\\entry_host.py

      - name: Build UI exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ssh-chat-ui .\\entry_ui.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-chat-windows-exe
          path: |
            dist/ssh-chat-host.exe
            dist/ssh-chat-ui.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ssh-chat-windows-exe
          path: dist

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ssh-chat-host.exe
            dist/ssh-chat-ui.exe
